---
apiVersion: v1
kind: Service
metadata:
  name: web-ui
  namespace: skybook
spec:
  type: NodePort
  selector:
    app: web-ui
  ports:
    - name: browser
      port: 80
      targetPort: 5000
      nodePort: 30080
    - name: internal
      port: 5000
      targetPort: 5000
---
