    spec:
      containers:
        - name: payment-service
          image: skybook-payment-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5003
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: skybook
spec:
  selector:
    app: payment-service
  ports:
    - port: 5003
      targetPort: 5003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: skybook
spec:
  replicas: 2
