---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: skybook
spec:
  selector:
    app: booking-service
  ports:
    - port: 5001
      targetPort: 5001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  namespace: skybook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
    spec:
      containers:
        - name: ticket-service
          image: skybook-ticket-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5004
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-service
